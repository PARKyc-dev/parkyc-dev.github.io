<script>
const searchPosts = [{% for post in site.posts %}{title:{{ post.title | jsonify }},url:{{ post.url | relative_url | jsonify }},text:{{ post.content | strip_html | normalize_whitespace | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}];
const openSearch=document.querySelector('.search-open'), searchPanel=document.querySelector('#workspace-search'), searchQuery=document.querySelector('#workspace-query'), searchResults=document.querySelector('#workspace-results');
openSearch.addEventListener('click',()=>{searchPanel.hidden=!searchPanel.hidden;openSearch.setAttribute('aria-expanded',String(!searchPanel.hidden));if(!searchPanel.hidden)searchQuery.focus()});
searchQuery.addEventListener('input',()=>{const q=searchQuery.value.trim().toLocaleLowerCase();searchResults.replaceChildren();if(!q)return;const matches=searchPosts.filter(p=>(p.title+' '+p.text).toLocaleLowerCase().includes(q));if(!matches.length){const item=document.createElement('li');item.textContent='검색 결과가 없습니다.';searchResults.append(item)}matches.forEach(p=>{const item=document.createElement('li'),link=document.createElement('a');link.href=p.url;link.textContent=p.title;item.append(link);searchResults.append(item)})});
</script>
