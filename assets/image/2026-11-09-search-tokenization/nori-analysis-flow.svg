<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="570" viewBox="0 0 1160 570" role="img" aria-labelledby="title desc">
<title id="title">Nori 분석 단계별 토큰 변화 예시</title>
<desc id="desc">리센느(RESCENE)의 멤버 원이, 미나미, 리브, 메이 그리고 제나를 분석하는 예시. 토큰 분리를 가정하고 품사 필터에서 의와 그리고를 제거한 뒤 RESCENE을 rescene으로 바꾼다.</desc>
