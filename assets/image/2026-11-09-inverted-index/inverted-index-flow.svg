<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-labelledby="title desc">
<title id="title">검색 엔진 예시로 보는 역색인과 AND 검색</title><desc id="desc">네 문서의 토큰을 검색과 엔진의 포스팅 리스트로 뒤집는다. 검색 엔진 검색어의 두 목록을 교집합하면 문서 1 2 4가 나온다.</desc>
<rect width="1400" height="830" rx="24" fill="#f4f7fb"/><g font-family="sans-serif" fill="#172b4d"><text x="55" y="65" font-size="30" font-weight="700">‘검색 엔진’으로 보는 역색인</text><text x="55" y="100" font-size="19" fill="#526984">문서별 토큰을 토큰별 문서 목록으로 바꾸고, 검색할 때 목록을 조합한다.</text>
<rect x="45" y="140" width="515" height="315" rx="18" fill="#fff" stroke="#c7d6e8"/><text x="70" y="180" font-size="23" font-weight="700">① 문서별 토큰</text><text x="70" y="213" font-size="16" fill="#526984">분석을 마친 결과라고 가정</text><text x="70" y="258" font-size="20">doc1 → [검색, 엔진, 루씬]</text><text x="70" y="299" font-size="20">doc2 → [검색, 엔진, 역색인]</text><text x="70" y="340" font-size="20">doc3 → [벡터, 검색, 문서]</text><text x="70" y="381" font-size="20">doc4 → [검색, 엔진, 검색]</text><text x="70" y="425" font-size="16" fill="#526984">doc4에 ‘검색’은 2번 등장한다.</text>
<rect x="770" y="140" width="585" height="315" rx="18" fill="#e6f4ef" stroke="#9bcdbb"/><text x="795" y="180" font-size="23" font-weight="700">② 역색인: 토큰 → 포스팅 리스트</text><text x="795" y="213" font-size="16" fill="#356354">각 토큰을 포함한 문서 ID를 정리</text><text x="795" y="266" font-size="21" font-weight="700">검색 → [1, 2, 3, 4]</text><text x="795" y="300" font-size="16" fill="#356354">df = 4 · doc4의 tf = 2</text><text x="795" y="350" font-size="21" font-weight="700">엔진 → [1, 2, 4]</text><text x="795" y="384" font-size="16" fill="#356354">df = 3 · doc4의 tf = 1</text><text x="795" y="425" font-size="16" fill="#356354">df: 등장한 문서 수 / tf: 한 문서의 등장 횟수</text>
<rect x="45" y="510" width="1310" height="220" rx="18" fill="#eaf1fc"/><text x="70" y="553" font-size="23" font-weight="700">③ ‘검색 엔진’을 AND 조건으로 검색</text><text x="70" y="600" font-size="19">검색어 분석</text><text x="70" y="638" font-size="22" font-weight="700">[검색, 엔진]</text><text x="400" y="600" font-size="19">두 포스팅 리스트</text><text x="400" y="638" font-size="21">[1, 2, 3, 4] ∩ [1, 2, 4]</text><text x="980" y="600" font-size="19">교집합: 두 토큰 모두 포함</text><text x="980" y="638" font-size="23" font-weight="700" fill="#16724c">[doc1, doc2, doc4]</text><text x="70" y="692" font-size="16" fill="#526984">AND는 두 토큰의 포함 여부를 확인한다. 순서와 인접 여부는 위치 정보로 별도 확인한다.</text>
<text x="55" y="783" font-size="17" fill="#526984">예시 토큰은 설명을 위한 가정이며, 실제 검색 결과는 분석기와 쿼리 조건에 따라 달라진다.</text></g><g stroke="#7189aa" stroke-width="3" fill="none"><path d="M590 290h140m-14-12 14 12-14 12"/><path d="M290 630h65m-10-9 10 9-10 9"/><path d="M860 630h65m-10-9 10 9-10 9"/></g><text x="610" y="270" font-family="sans-serif" font-size="17" fill="#526984">방향 전환</text></svg>
